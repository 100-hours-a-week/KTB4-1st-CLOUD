# 기본 Compose의 FE·BE·AI·MySQL·Nginx를 유지하고 시험용 설정만 덮어쓴다.
services:
  mysql:
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1001
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
  springboot:
    environment:
      SENTRY_DSN: ''
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '8'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '2'
  nextjs:
    environment:
      BACKEND_API_BASE_URL: http://springboot:8080
  nginx:
    command: [nginx, -g, 'daemon off;']
    volumes: !override
      - ./loadtest/migration/certs:/etc/nginx/certs:ro
      - ./loadtest/migration/nginx.conf:/etc/nginx/conf.d/default.conf:ro
