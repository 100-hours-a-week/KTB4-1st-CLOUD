# 요청별 처리 시간과 upstream 정보를 JSON으로 기록한다.
log_format loadtest_timing escape=json
  '{"ts":"$time_iso8601","status":"$status","method":"$request_method","uri":"$uri",'
  '"rt":"$request_time","urt":"$upstream_response_time","uct":"$upstream_connect_time",'
  '"uht":"$upstream_header_time","upstream":"$upstream_addr","bytes":"$body_bytes_sent",'
  '"conn":"$connection","conn_reqs":"$connection_requests","proto":"$server_protocol"}';

access_log /var/log/nginx-timing/access.json loadtest_timing;

# Nginx 연결 상태를 제공한다.
server {
    listen 8081;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
