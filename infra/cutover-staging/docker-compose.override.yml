services:
  mysql:
    profiles: [local-db]
  springboot:
    depends_on: !override
      fastapi:
        condition: service_healthy
    environment:
      SENTRY_DSN: ''
      SPRING_FLYWAY_ENABLED: 'false'
      JPA_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: never
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?staging Kafka bootstrap server is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '8'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '2'
  nextjs:
    environment:
      BACKEND_API_BASE_URL: http://springboot:8080
  nginx:
    command: [nginx, -g, 'daemon off;']
    volumes: !override
      - /opt/app/shared/certs:/etc/nginx/certs:ro
      - ./infra/cutover-staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
