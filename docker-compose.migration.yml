services:
  springboot:
    environment:
      SPRING_PROFILES_ACTIVE: migration
      MIGRATION_EC2_DB_URL: ${MIGRATION_EC2_DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true}
      MIGRATION_EC2_DB_USERNAME: ${MIGRATION_EC2_DB_USERNAME:-${MYSQL_USER}}
      MIGRATION_EC2_DB_PASSWORD: ${MIGRATION_EC2_DB_PASSWORD:-${MYSQL_PASSWORD}}
      MIGRATION_RDS_DB_URL: ${MIGRATION_RDS_DB_URL:?MIGRATION_RDS_DB_URL is required}
      MIGRATION_RDS_DB_USERNAME: ${MIGRATION_RDS_DB_USERNAME:?MIGRATION_RDS_DB_USERNAME is required}
      MIGRATION_RDS_DB_PASSWORD: ${MIGRATION_RDS_DB_PASSWORD:?MIGRATION_RDS_DB_PASSWORD is required}
      MIGRATION_DB_MAX_POOL_SIZE: ${MIGRATION_DB_MAX_POOL_SIZE:-20}
      MIGRATION_DB_MIN_IDLE: ${MIGRATION_DB_MIN_IDLE:-2}
      MIGRATION_DB_CONNECTION_TIMEOUT_MS: ${MIGRATION_DB_CONNECTION_TIMEOUT_MS:-5000}
      MIGRATION_BARRIER_TIMEOUT_MS: ${MIGRATION_BARRIER_TIMEOUT_MS:-30000}
