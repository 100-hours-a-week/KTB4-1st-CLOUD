services:
  #######################
  # 메인 DB
  #######################
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    # dirty page 디스크 플러시를 위한 대기 시간 확보
    stop_grace_period: 1m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    # 256MB 환경 구동을 위한 메모리 다이어트 옵션 전달
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      # 포트 오픈 여부가 아닌 실제 쿼리 응답 여부 검증
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend-net

  #######################
  # AI 중계 서버
  #######################
  fastapi:
    image: ${FASTAPI_IMAGE} # GitHub Actions에서 빌드/푸시한 이미지 태그
    container_name: fastapi
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY} # AI 서버 Settings.anthropic_api_key (필수값, 없으면 기동 실패)
      - TZ=Asia/Seoul
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/readiness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - backend-net

  #######################
  # 핵심 비즈니스 로직 API 서버
  #######################
  springboot:
    image: ${SPRINGBOOT_IMAGE}
    container_name: springboot
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET} # 32바이트 이상
      - CORS_ALLOWED_ORIGINS=https://bakkucca.com,https://www.bakkucca.com # CORS와 WebSocket 허용 Origin
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      # 카카오 로그인
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - FRONTEND_REDIRECT_URI=${FRONTEND_REDIRECT_URI} # 카카오 콜백 처리 후 BE가 돌려보낼 FE 페이지
      # AI 서버 호출 주소 (BE는 엔드포인트 전체 URL)
      - AI_IMAGE_ANALYSIS_URL=http://fastapi:8000/api/vision/analyze-item
      - AI_TEXT_MODERATION_URL=http://fastapi:8000/api/moderation/check-text
      - AI_ITEM_PRICE_URL=http://fastapi:8000/value/estimate-price
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-validate}
      - TZ=Asia/Seoul
      # JVM 힙 메모리를 512MB로 제한하고 GC 오버헤드를 줄이기 위한 옵션
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m
      # AWS 인증
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      mysql:
        condition: service_healthy # MySQL 핑 응답 확인 후 구동 시작
      fastapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s # Spring Boot JVM 부팅 시간을 감안한 유예시간
    logging: *default-logging
    networks:
      - backend-net
      - frontend-net

  #######################
  # SSR 웹 서버
  #######################
  nextjs:
    image: ${NEXTJS_IMAGE}
    container_name: nextjs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=256
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - frontend-net

  #######################
  # Reverse Proxy
  #######################
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-certs:/etc/letsencrypt:ro # 발급된 인증서
      - certbot-challenge:/var/www/certbot:ro # Let's Encrypt 검증 파일
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      springboot:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    # 헬스체크: 80번은 전부 HTTPS로 리다이렉트되어 컨테이너 내부 확인이 실패함
    # 배포 시 script/deploy.sh가 443을 거친 실제 요청으로 nginx를 검증
    logging: *default-logging
    networks:
      - frontend-net

  #######################
  # 인증서 발급/갱신 전용 컨테이너
  #######################
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    profiles: ["tools"] # 상시 구동할 필요가 없기 때문에 명시적으로 호출할 때만 동작
    volumes:
      - certbot-certs:/etc/letsencrypt:rw
      - certbot-challenge:/var/www/certbot:rw

# 네트워크 분리: DB/캐시는 외부에 노출되지 않도록 완전 격리
networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  mysql-data:
  certbot-certs:
  certbot-challenge:
