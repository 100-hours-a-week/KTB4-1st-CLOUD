# 웹소켓 프로토콜 전환을 위한 Connection 헤더 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server nextjs:3000;
}

upstream backend {
    server springboot:8080;
}

# HTTP 서버 (포트 80) - SSL 발급 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name bakkucca.com www.bakkucca.com;

    # Certbot SSL 인증서 발급/갱신을 위한 ACME 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 서버 (포트 443) - 메인 라우팅 및 웹소켓
server {
    listen 443 ssl;
    http2 on;

    server_name bakkucca.com www.bakkucca.com;

    # SSL 인증서 경로 (Certbot 볼륨 마운트 경로)
    ssl_certificate /etc/letsencrypt/live/bakkucca.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakkucca.com/privkey.pem;

    # 이미지 업로드 등 대용량 파일 전송 제한 해제 (기본 1MB -> 20MB)
    client_max_body_size 20M;

    # 공통 프록시 헤더 설정(하위에 proxy_set_header가 없는 location에 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location /ws/ {
        proxy_pass http://backend;

        # 웹소켓 프로토콜 업그레이드 필수 설정 (HTTP 1.1 필요)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 세션 유지 시간 설정 (기본 60초 만료 방지)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 실시간 메시지 전달을 위해 Nginx 내부 버퍼링 비활성화
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend/;
    }

    location / {
        proxy_pass http://frontend;

        # Next.js 내부 페이지 전환 및 프리패칭 대응
        proxy_http_version 1.1;

        # WebSocket 및 스트리밍 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}