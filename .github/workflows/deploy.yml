name: Deploy Production

# Actions 목록에 배포 버전과 실행자가 보이도록 지정
run-name: "Deploy: ${{ inputs.release_version }} (${{ github.actor }})"

# 정기 배포, 수동 롤백: 인프라 담당자가 main에 병합된 Release Bundle 버전을 입력해 실행
#   - 수동 롤백은 이전 버전(예: v1.0.0)을 입력해 같은 방식으로 실행한다
#   - GitHub 러너: 번들 읽기 → 이미지 존재 확인 → 배포 파일을 EC2에 업로드 → EC2 GHCR 로그인 → SSH로 deploy.sh 실행 → 디스코드 알림
#   - EC2(script/deploy.sh): pull → 교체 → 검증 → 실패 시 낮은 버전의 번들로 최대 4번 롤백
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "배포할 Release Bundle 버전 (releases/<버전>.yaml, 예: v1.0.0)"
        required: true
        type: string

# 배포 중 새로 실행되면 이전 배포가 끝날 때까지 대기
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read # GHCR 이미지 존재 확인

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  EC2: ec2-user@${{ vars.EC2_HOST }} # EC2 탄력적 IP (Actions Variables)
  PKG: /tmp/deploy-pkg

jobs:
  deploy:
    name: 운영 배포
    runs-on: ubuntu-24.04
    # main에 병합된 워크플로우와 번들만 배포에 사용
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release Bundle 읽기
        id: bundle
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 vMAJOR.MINOR.PATCH 형식이어야 합니다: $RELEASE_VERSION"
            exit 1
          fi
          if [ ! -f "releases/${RELEASE_VERSION}.yaml" ]; then
            echo "::error::releases/${RELEASE_VERSION}.yaml 이 main에 없습니다. Release Bundle PR이 병합되었는지 확인하세요."
            exit 1
          fi

          # 롤백 후보: 배포 버전보다 낮은 번들을 내림차순으로 최대 4개 (1st wiki CD 설계)
          all_versions="$(for f in releases/v*.yaml; do basename "$f" .yaml; done | sort -V)"
          candidates="$(sed "/^${RELEASE_VERSION}\$/,\$d" <<< "$all_versions" | tail -n 4 | tac | xargs)"
          echo "candidates=${candidates}" >> "$GITHUB_OUTPUT"

          # 번들마다 compose 이미지 변수 파일을 만든다(service_name nextjs → NEXTJS_IMAGE).
          # 태그 대신 digest로 고정해 번들 검토 때와 같은 이미지를 배포한다.
          mkdir -p "$PKG/releases"
          for version in "$RELEASE_VERSION" $candidates; do
            env_file="$PKG/releases/${version}.env"
            yq '.services[] | (.service_name | upcase) + "_IMAGE=" + .image_uri + ":" + .image_tag + "@" + .image_digest' \
              "releases/${version}.yaml" > "$env_file"
            if [ "$(grep -cE '^[A-Z]+_IMAGE=[^ ]+@sha256:[0-9a-f]{64}$' "$env_file")" != 3 ]; then
              echo "::error::releases/${version}.yaml 의 이미지 정보가 올바르지 않습니다."
              cat "$env_file"
              exit 1
            fi
          done

          echo "배포: ${RELEASE_VERSION} / 롤백 후보: ${candidates:-없음}"
          cat "$PKG/releases/${RELEASE_VERSION}.env"

      - name: GHCR 이미지 존재 확인
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          # 이미지 보존 정책(최근 5개)으로 지워졌을 수 있어 배포 전에 다시 확인
          while IFS='=' read -r var ref; do
            script/ghcr-inspect.sh "${ref%%:*}" "${ref##*@}" > /dev/null
            echo "확인: ${var}"
          done < "$PKG/releases/${RELEASE_VERSION}.env"

      - name: SSH 접속 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          host="${EC2#*@}"
          if [ -z "$host" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_HOST 변수 또는 EC2_SSH_KEY 시크릿이 없습니다."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2> /dev/null
          printf 'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' "$host" >> ~/.ssh/config

      - name: EC2 배포
        id: deploy
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CANDIDATES: ${{ steps.bundle.outputs.candidates }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 배포 파일: compose, nginx 설정, 배포 스크립트, 비밀값(ENV_FILE에서 이미지 변수는 번들 값을 쓰므로 제외)
          mkdir -p "$PKG/nginx"
          cp docker-compose.yml docker-compose.awslogs.yml "$PKG/"
          cp nginx/default.conf "$PKG/nginx/"
          cp script/deploy.sh "$PKG/"
          printf '%s\n' "$ENV_FILE" | grep -vE '^(NEXTJS|SPRINGBOOT|FASTAPI)_IMAGE=|^COMPOSE_FILE=' > "$PKG/base.env"
          # EC2에서는 컨테이너 로그를 CloudWatch Logs로 보내는 설정을 겹쳐 적용
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.awslogs.yml" >> "$PKG/base.env"

          # ~/bakkucca 에 업로드. 디렉터리 이름(bakkucca)이 compose 프로젝트 이름이 되어 볼륨 이름을 정한다.
          tar -czf - -C "$PKG" . | ssh "$EC2" 'rm -rf ~/bakkucca/releases && mkdir -p ~/bakkucca && tar -xzf - -C ~/bakkucca'
          rm -rf "$PKG"

          # EC2가 비공개 GHCR 이미지를 받을 수 있도록 이번 실행의 GITHUB_TOKEN으로 로그인한다.
          # 토큰은 이 작업이 끝나면 만료되므로 EC2에 PAT를 따로 두고 관리할 필요가 없다(배포·롤백 pull은 모두 이 작업 안에서 일어남).
          # shellcheck disable=SC2029 # 사용자 이름은 러너에서 채워 보내는 것이 의도
          if ! printf '%s' "$GHCR_TOKEN" | ssh "$EC2" "docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin" > /dev/null; then
            echo "::error::EC2에서 GHCR 로그인에 실패했습니다. ec2-user가 docker 그룹에 있는지 확인하세요."
            echo "code=3" >> "$GITHUB_OUTPUT" # 운영 변경 없이 중단
            exit 1
          fi

          set +e
          # shellcheck disable=SC2029 # 버전 인자는 러너에서 채워 보내는 것이 의도
          ssh "$EC2" "bash ~/bakkucca/deploy.sh ${RELEASE_VERSION} ${CANDIDATES}"
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"

          case "$code" in
            0) echo "배포 성공: ${RELEASE_VERSION}" ;;
            1) echo "::error::배포 검증에 실패해 이전 버전으로 롤백했습니다."; exit 1 ;;
            2) echo "::error::배포 검증에 실패했고 롤백도 모두 실패했습니다. 즉시 수동 대응이 필요합니다."; exit 1 ;;
            3) echo "::error::이미지 pull에 실패해 배포하지 않았습니다. 운영 중인 서비스는 변경되지 않았습니다."; exit 1 ;;
            *) echo "::error::SSH 실행이 비정상 종료했습니다(code=${code})."; exit 1 ;;
          esac

      - name: 디스코드 알림
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          CODE: ${{ steps.deploy.outputs.code }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. 웹훅 URL 미등록 시 에러 없이 건너뜀
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi

          # 2. 배포 결과별 색상, 제목, 설명
          if [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=15105570; STATUS_EMOJI="⚠️"; STATUS_TEXT="취소됨"
            DETAIL="워크플로우가 취소됐습니다. EC2에서는 배포가 계속 진행될 수 있으니 상태를 확인하세요."
          else
            case "$CODE" in
              0)
                COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="배포 성공"
                DETAIL="검증을 통과했습니다." ;;
              1)
                COLOR=15105570; STATUS_EMOJI="⚠️"; STATUS_TEXT="배포 실패, 롤백 완료"
                DETAIL="검증에 실패해 이전 번들로 롤백했습니다. 실행 로그에서 실패 원인을 확인하세요." ;;
              2)
                COLOR=15158332; STATUS_EMOJI="🚨"; STATUS_TEXT="배포 실패, 롤백 실패"
                DETAIL="롤백 후보도 모두 실패했습니다. 즉시 확인이 필요합니다." ;;
              3)
                COLOR=15105570; STATUS_EMOJI="⚠️"; STATUS_TEXT="배포 중단"
                DETAIL="이미지 pull 또는 EC2 GHCR 로그인에 실패했습니다. 운영 중인 서비스는 바뀌지 않았습니다." ;;
              "")
                COLOR=15105570; STATUS_EMOJI="⚠️"; STATUS_TEXT="배포 중단"
                DETAIL="배포 전 단계(번들 확인, 이미지 확인, 파일 업로드)에서 실패했습니다. 운영 중인 서비스는 바뀌지 않았습니다." ;;
              *)
                COLOR=15158332; STATUS_EMOJI="🚨"; STATUS_TEXT="배포 결과 불명"
                DETAIL="EC2 실행이 비정상 종료했습니다(code=${CODE}). 운영 상태를 확인하세요." ;;
            esac
          fi

          # 3. 번들의 이미지 태그
          BUNDLE="releases/${RELEASE_VERSION}.yaml"
          IMAGES="번들을 찾지 못함"
          if [ -f "$BUNDLE" ]; then
            IMAGES="FE \`$(yq '.services.frontend.image_tag' "$BUNDLE")\` / BE \`$(yq '.services.backend.image_tag' "$BUNDLE")\` / AI \`$(yq '.services.ai.image_tag' "$BUNDLE")\`"
          fi

          # 4. jq를 통한 안전한 JSON 직렬화
          jq -n \
            --arg title "${STATUS_EMOJI} [${WORKFLOW_NAME}] ${STATUS_TEXT}" \
            --argjson color "$COLOR" \
            --arg version "\`${RELEASE_VERSION}\`" \
            --arg actor "$ACTOR" \
            --arg images "$IMAGES" \
            --arg detail "$DETAIL" \
            --arg run_url "[GitHub Actions 실행 로그 바로가기](${RUN_URL})" \
            --arg time "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    { name: "배포 버전", value: $version, inline: true },
                    { name: "실행자", value: $actor, inline: true },
                    { name: "이미지", value: $images },
                    { name: "결과", value: $detail },
                    { name: "상세 로그", value: $run_url }
                  ],
                  footer: { text: "바꾸까 배포 알림" },
                  timestamp: $time
                }
              ]
            }' > "$RUNNER_TEMP/discord.json"

          # 5. Webhook 전송 (실패해도 워크플로우를 중단시키지 않음)
          curl -s -S --fail \
            -H "Content-Type: application/json" \
            -X POST \
            -d @"$RUNNER_TEMP/discord.json" \
            "$WEBHOOK_URL" || echo "::warning::디스코드 알림 전송에 실패했습니다."
