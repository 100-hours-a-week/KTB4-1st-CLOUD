name: Deploy Production

run-name: "Deploy: ${{ inputs.release_version }} (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "배포할 Release Bundle 버전 (예: v1.0.0)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  EC2: ec2-user@${{ vars.EC2_HOST }}
  PKG: /tmp/deploy-pkg

jobs:
  deploy:
    name: 운영 배포
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse Release Bundle & Prepare Package
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          
          # 버전 입력 검증
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 vMAJOR.MINOR.PATCH 형식이어야 합니다: $RELEASE_VERSION"
            exit 1
          fi
          
          BUNDLE="releases/${RELEASE_VERSION}.yaml"
          
          if [[ ! -f "$BUNDLE" ]]; then
            echo "::error::$BUNDLE 파일이 없습니다. Release Bundle PR 병합 여부를 확인하세요."
            exit 1
          fi
          
          if [[ ! -f docker-compose.yml ]]; then
            echo "::error::docker-compose.yml 파일이 없습니다."
            exit 1
          fi
          
          # 파서 실행에 필요한 스크립트 권한 설정
          chmod +x scripts/*.sh
          
          # build/<version>/.env.release 및 docker-compose.yml 생성
          ./scripts/parse-release-bundle.sh "$RELEASE_VERSION"
          
          RELEASE_BUILD="build/${RELEASE_VERSION}"
          
          for file in \
            "${RELEASE_BUILD}/.env.release" \
            "${RELEASE_BUILD}/docker-compose.yml"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::필수 배포 파일이 없거나 비어 있습니다: $file"
              exit 1
            fi
          done
          
          # 필수 서비스 이미지 3개 및 digest 고정 여부 확인
          ENV_RELEASE="${RELEASE_BUILD}/.env.release"
          
          for service in SPRINGBOOT FASTAPI NEXTJS; do
            if ! grep -q "^${service}_IMAGE=" "$ENV_RELEASE"; then
              echo "::error::.env.release에 ${service}_IMAGE가 없습니다."
              exit 1
            fi
          done
          
          image_count="$(grep -cE '^[A-Z]+_IMAGE=' "$ENV_RELEASE" || true)"
          if [[ "$image_count" != "3" ]]; then
            echo "::error::.env.release의 이미지 항목은 정확히 3개여야 합니다."
            cat "$ENV_RELEASE"
            exit 1
          fi
          
          while IFS='=' read -r key ref; do
            [[ "$key" =~ _IMAGE$ ]] || continue
          
            if [[ ! "$ref" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${key} 이미지가 유효한 SHA-256 digest 형식이 아닙니다: ${ref}"
              echo "::error::운영 배포에는 digest가 고정된 이미지를 사용하세요."
              exit 1
            fi
          done < "$ENV_RELEASE"
          
          # 이전 실행의 임시 파일 제거 후 패키지 구성
          rm -rf "$PKG"
          mkdir -p \
            "$PKG/scripts" \
            "$PKG/shared/nginx" \
            "$PKG/releases/${RELEASE_VERSION}"
          
          # EC2에서 실행할 스크립트
          cp \
            scripts/parse-release-bundle.sh \
            scripts/deploy.sh \
            scripts/rollback.sh \
            scripts/verify.sh \
            "$PKG/scripts/"
          
          # Nginx 설정
          cp nginx/default.conf "$PKG/shared/nginx/default.conf"
          
          # 릴리즈별 배포 파일
          cp \
            "${RELEASE_BUILD}/.env.release" \
            "${RELEASE_BUILD}/docker-compose.yml" \
            "$PKG/releases/${RELEASE_VERSION}/"
          
          # CloudWatch Logs override가 저장소에 존재하면 함께 배포
          if [[ -f docker-compose.awslogs.yml ]]; then
            cp \
              docker-compose.awslogs.yml \
              "$PKG/releases/${RELEASE_VERSION}/"
            echo "AWSLOGS_ENABLED=true" >> "$GITHUB_OUTPUT"
          else
            echo "AWSLOGS_ENABLED=false" >> "$GITHUB_OUTPUT"
          fi
          
          echo "배포 패키지 생성 완료: ${RELEASE_VERSION}"
          cat "$ENV_RELEASE"

      - name: Inspect GHCR Images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          
          ENV_RELEASE="$PKG/releases/${RELEASE_VERSION}/.env.release"
          
          if [[ -z "$GHCR_TOKEN" || -z "$GHCR_USER" ]]; then
            echo "::error::GHCR 인증 정보가 없습니다."
            exit 1
          fi
          
          while IFS='=' read -r key ref; do
            [[ "$key" =~ _IMAGE$ ]] || continue
          
            # uri@sha256:digest 형식으로 분리한다.
            image_uri="${ref%@*}"
            image_digest="${ref##*@}"
          
            echo "GHCR 이미지 확인: ${key} (${image_uri})"
          
            scripts/ghcr-inspect.sh \
              "$image_uri" \
              "$image_digest" \
              > /dev/null
          
            echo "확인 완료: ${key}"
          done < "$ENV_RELEASE"

      - name: Setup SSH Connection
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          
          host="${EC2#*@}"
          
          if [[ -z "$host" || -z "$EC2_SSH_KEY" ]]; then
            echo "::error::EC2_HOST 변수 또는 EC2_SSH_KEY 시크릿이 없습니다."
            exit 1
          fi
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          
          printf \
            'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' \
            "$host" >> ~/.ssh/config
          
          chmod 600 ~/.ssh/config

      - name: Upload Release & Shared Configuration
        id: upload
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          
          if [[ -z "$ENV_FILE" ]]; then
            echo "::error::ENV_FILE 시크릿이 비어 있습니다."
            exit 1
          fi
          
          # 번들에서 관리하는 이미지 변수는 공유 환경 변수에서 제외한다.
          # 기존 COMPOSE_FILE도 제거해 override 설정이 중복되지 않게 한다.
          printf '%s\n' "$ENV_FILE" |
            awk '
              !/^(NEXTJS|SPRINGBOOT|FASTAPI)_IMAGE=/ &&
              !/^COMPOSE_FILE=/ {
                print
              }
            ' > "$PKG/shared/.env.shared"
          
          # Compose override는 해당 릴리즈 디렉터리에 함께 배치한다.
          # .env.release와 합쳐진 .env를 통해 Compose 파일을 선택한다.
          if [[ "${{ steps.bundle.outputs.AWSLOGS_ENABLED }}" == "true" ]]; then
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.awslogs.yml" \
              >> "$PKG/shared/.env.shared"
          fi
          
          chmod 600 "$PKG/shared/.env.shared"
          
          # EC2에서 /opt/app은 ec2-user가 쓸 수 있도록 사전 설정되어 있어야 한다.
          # releases 전체를 삭제하지 않아 current/previous 릴리즈를 보존한다.
          tar -czf - -C "$PKG" . |
            ssh "$EC2" '
              set -e
              test -d /opt/app
              test -w /opt/app
              mkdir -p \
                /opt/app/scripts \
                /opt/app/shared/nginx \
                /opt/app/shared/certs \
                /opt/app/releases
              tar -xzf - -C /opt/app
              chmod +x /opt/app/scripts/*.sh
              chmod 600 /opt/app/shared/.env.shared
            '
          
          echo "EC2 업로드 완료: /opt/app/releases/${RELEASE_VERSION}"

      - name: Deploy to EC2
        id: deploy
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          if [[ -z "$GHCR_TOKEN" ]]; then
            echo "::error::GITHUB_TOKEN이 비어 있습니다."
            echo "code=3" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # EC2에서 비공개 GHCR 이미지에 접근할 수 있도록 인증
          if ! printf '%s' "$GHCR_TOKEN" |
            ssh "$EC2" \
              "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin" \
              > /dev/null; then
            echo "::error::EC2 GHCR 로그인에 실패했습니다."
            echo "code=3" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # 배포 스크립트는 자체적으로 current/previous와 롤백을 관리한다.
          # 버전은 앞 단계에서 vMAJOR.MINOR.PATCH 형식으로 검증되었다.
          set +e
          ssh "$EC2" \
            "bash /opt/app/scripts/deploy.sh '${RELEASE_VERSION}'"
          code=$?
          set -e
          
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          
          case "$code" in
            0)
              echo "배포 성공: ${RELEASE_VERSION}"
              ;;
            1)
              echo "::error::배포 검증 실패. 직전 안정 버전으로 롤백되었습니다."
              exit 1
              ;;
            2)
              echo "::error::배포와 롤백이 모두 실패했습니다. 즉시 수동 대응이 필요합니다."
              exit 1
              ;;
            3)
              echo "::error::이미지 Pull 또는 배포 사전 조건 확인에 실패했습니다."
              exit 1
              ;;
            *)
              echo "::error::EC2 배포 실행 결과가 비정상입니다. exit code=${code}"
              exit 1
              ;;
          esac

      - name: Send Discord Notification
        if: always()
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CODE: ${{ steps.deploy.outputs.code }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL이 없어 알림을 건너뜁니다."
            exit 0
          fi
          
          if [[ "$JOB_STATUS" == "cancelled" ]]; then
            COLOR=15105570
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="취소됨"
            DETAIL="워크플로우가 취소되었습니다. EC2의 배포 및 컨테이너 상태를 확인하세요."
          else
            case "$CODE" in
              0)
                COLOR=3066993
                STATUS_EMOJI="✅"
                STATUS_TEXT="배포 성공"
                DETAIL="신규 버전 배포 및 검증이 완료되었습니다."
                ;;
              1)
                COLOR=15105570
                STATUS_EMOJI="⚠️"
                STATUS_TEXT="배포 실패, 롤백 완료"
                DETAIL="신규 배포 검증에 실패했으나 직전 안정 버전으로 복구되었습니다."
                ;;
              2)
                COLOR=15158332
                STATUS_EMOJI="🚨"
                STATUS_TEXT="배포 및 롤백 실패"
                DETAIL="배포와 롤백이 모두 실패했습니다. 즉시 수동 대응이 필요합니다."
                ;;
              3)
                COLOR=15105570
                STATUS_EMOJI="⚠️"
                STATUS_TEXT="배포 중단"
                DETAIL="이미지 Pull 또는 사전 조건 확인에 실패했습니다. 운영 상태를 확인하세요."
                ;;
              "")
                COLOR=15105570
                STATUS_EMOJI="⚠️"
                STATUS_TEXT="배포 전 단계 실패"
                DETAIL="번들 검사, 이미지 확인, SSH 또는 파일 업로드 단계에서 실패했습니다."
                ;;
              *)
                COLOR=15158332
                STATUS_EMOJI="🚨"
                STATUS_TEXT="배포 결과 불명"
                DETAIL="배포 결과를 확인할 수 없습니다. EC2와 GitHub Actions 로그를 확인하세요."
                ;;
            esac
          fi
          
          BUNDLE="releases/${RELEASE_VERSION}.yaml"
          IMAGES="번들 정보 없음"
          
          if [[ -f "$BUNDLE" ]]; then
            FE_TAG="$(yq '.services.frontend.image_tag // "unknown"' "$BUNDLE")"
            BE_TAG="$(yq '.services.backend.image_tag // "unknown"' "$BUNDLE")"
            AI_TAG="$(yq '.services.ai.image_tag // "unknown"' "$BUNDLE")"
          
            IMAGES="FE \`${FE_TAG}\` / BE \`${BE_TAG}\` / AI \`${AI_TAG}\`"
          fi
          
          jq -n \
            --arg title "${STATUS_EMOJI} [${WORKFLOW_NAME}] ${STATUS_TEXT}" \
            --argjson color "$COLOR" \
            --arg version "$RELEASE_VERSION" \
            --arg actor "$ACTOR" \
            --arg images "$IMAGES" \
            --arg detail "$DETAIL" \
            --arg run_url "$RUN_URL" \
            --arg time "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    {name: "배포 버전", value: $version, inline: true},
                    {name: "실행자", value: $actor, inline: true},
                    {name: "서비스 이미지", value: $images},
                    {name: "결과", value: $detail},
                    {name: "실행 로그", value: $run_url}
                  ],
                  footer: {text: "바꾸까 배포 알림"},
                  timestamp: $time
                }
              ]
            }' > "$RUNNER_TEMP/discord.json"
          
          curl -sS --fail \
            -H "Content-Type: application/json" \
            -X POST \
            -d @"$RUNNER_TEMP/discord.json" \
            "$WEBHOOK_URL" ||
            echo "::warning::Discord 알림 전송에 실패했습니다."
