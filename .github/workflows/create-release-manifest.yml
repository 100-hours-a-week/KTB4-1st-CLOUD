name: Create Release Manifest

# Actions 목록에 Release Bundle 버전과 실행자가 보이도록 지정
run-name: "Release Bundle: ${{ inputs.release_version }} (${{ github.actor }})"

# 인프라 담당자가 배포할 FE/BE/AI 이미지 태그와 Release Bundle 버전을 입력
#   - 입력한 태그가 GHCR에 실제로 있는지 Docker Registry API로 확인하고, digest/커밋 SHA/빌드 시각을 자동 기입(휴먼 에러 방지)
#   - releases/<버전>.yaml을 release/<버전> 브랜치에 커밋해 push한다. main 대상 PR은 사람이 연다(PR 자동 생성은 추후)
#   - 생성만 담당한다. release/<버전> 브랜치가 이미 있으면 중단한다(버전 수정은 추후 update-release-manifest)
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Bundle 버전 (예: v1.0.0)"
        required: true
        type: string
      frontend_tag:
        description: "FE 이미지 태그 (GHCR에 있는 태그 그대로, 예: 1.0.1)"
        required: true
        type: string
      backend_tag:
        description: "BE 이미지 태그 (GHCR에 있는 태그 그대로, 예: v1.0.2)"
        required: true
        type: string
      ai_tag:
        description: "AI 이미지 태그 (GHCR에 있는 태그 그대로, 예: 1.0.0)"
        required: true
        type: string
      description:
        description: "릴리즈 설명 (예: 정기 릴리즈 - 채팅 안정화)"
        required: false
        type: string
        default: "정기 릴리즈"

# 같은 버전의 번들 생성이 동시에 실행되지 않도록 직렬 처리
concurrency:
  group: release-manifest-${{ inputs.release_version }}
  cancel-in-progress: false

permissions:
  contents: write # release/<버전> 브랜치 push
  packages: read # GHCR 이미지 메타데이터 조회

jobs:
  create-manifest:
    name: Release Bundle 생성
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      FRONTEND_TAG: ${{ inputs.frontend_tag }}
      BACKEND_TAG: ${{ inputs.backend_tag }}
      AI_TAG: ${{ inputs.ai_tag }}
      DESCRIPTION: ${{ inputs.description }}
      # FE/BE/AI 패키지에 CLOUD 레포의 Actions 접근 권한을 부여해 두었으므로 GITHUB_TOKEN으로 조회
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 입력값 검증
        run: |
          set -euo pipefail

          # 이후 step에서 쓸 임시 파일 경로
          echo "BUNDLE_FILE=${RUNNER_TEMP}/bundle.yaml" >> "$GITHUB_ENV"

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release Bundle 버전은 vMAJOR.MINOR.PATCH 형식이어야 합니다: $RELEASE_VERSION"
            exit 1
          fi

          # 운영 배포용 시맨틱 버전 태그만 허용(latest, dev-* 처럼 가리키는 이미지가 바뀌는 태그 차단)
          for pair in "FE:$FRONTEND_TAG" "BE:$BACKEND_TAG" "AI:$AI_TAG"; do
            if [[ ! "${pair#*:}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${pair%%:*} 태그는 시맨틱 버전이어야 합니다: ${pair#*:}"
              exit 1
            fi
          done

          # main에 병합된 번들은 배포 기록이므로 수정하지 않는다. 조합을 바꾸려면 새 버전으로 만든다.
          if [ -f "releases/${RELEASE_VERSION}.yaml" ]; then
            echo "::error::releases/${RELEASE_VERSION}.yaml 이 이미 main에 있습니다. 새 버전 번호로 다시 실행하세요."
            exit 1
          fi

          # 생성만 담당하므로 같은 버전의 브랜치가 이미 있으면 중단
          if git ls-remote --exit-code --heads origin "release/${RELEASE_VERSION}" > /dev/null; then
            echo "::error::release/${RELEASE_VERSION} 브랜치가 이미 있습니다. 기존 PR을 확인하세요."
            exit 1
          fi

      - name: GHCR 이미지 확인 및 Release Bundle 생성
        run: |
          set -euo pipefail

          RELEASE_DATE="$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M:%S%:z)"
          export RELEASE_DATE
          yq -n '
            .release_metadata.bundle_version = strenv(RELEASE_VERSION) |
            .release_metadata.release_date = strenv(RELEASE_DATE) |
            .release_metadata.released_by = strenv(GITHUB_ACTOR) |
            .release_metadata.target_environment = "production" |
            .release_metadata.description = strenv(DESCRIPTION)
          ' > "$BUNDLE_FILE"

          # add_service <번들 파일 안의 이름> <docker-compose.yml의 서비스 이름> <이미지> <태그>
          #   - 번들 파일 안의 이름(frontend/backend/ai): releases/<버전>.yaml의 services 아래 항목 이름
          #   - docker-compose.yml의 서비스 이름(nextjs/springboot/fastapi): 배포 시 이미지 변수 이름을 만드는 데 쓴다(nextjs → NEXTJS_IMAGE)
          add_service() {
            export KEY="$1" SERVICE_NAME="$2" IMAGE_URI="$3" IMAGE_TAG="$4"
            echo "::group::${KEY}: ${IMAGE_URI}:${IMAGE_TAG}"
            meta="$(script/ghcr-inspect.sh "$IMAGE_URI" "$IMAGE_TAG")"
            echo "$meta"
            echo "::endgroup::"

            IMAGE_DIGEST="$(jq -r '.digest' <<< "$meta")"
            GIT_COMMIT_SHA="$(jq -r '.git_commit_sha' <<< "$meta")"
            GIT_COMMIT_SHORT="${GIT_COMMIT_SHA:0:7}"
            BUILT_AT="$(jq -r '.built_at' <<< "$meta")"
            export IMAGE_DIGEST GIT_COMMIT_SHA GIT_COMMIT_SHORT BUILT_AT
            if [ -z "$GIT_COMMIT_SHA" ]; then
              echo "::warning::${KEY} 이미지에 org.opencontainers.image.revision 라벨이 없어 커밋 SHA를 기록하지 못했습니다."
            fi

            yq -i '.services[strenv(KEY)] = {
              "service_name": strenv(SERVICE_NAME),
              "image_uri": strenv(IMAGE_URI),
              "image_tag": strenv(IMAGE_TAG),
              "image_digest": strenv(IMAGE_DIGEST),
              "git_commit_sha": strenv(GIT_COMMIT_SHA),
              "git_commit_short": strenv(GIT_COMMIT_SHORT),
              "built_at": strenv(BUILT_AT)
            }' "$BUNDLE_FILE"
          }

          add_service frontend nextjs     ghcr.io/100-hours-a-week/ktb4-1st-fe "$FRONTEND_TAG"
          add_service backend  springboot ghcr.io/100-hours-a-week/ktb4-1st-be "$BACKEND_TAG"
          add_service ai       fastapi    ghcr.io/100-hours-a-week/ktb4_1st_ai "$AI_TAG"

          { echo "# 이 파일은 create-release-manifest 워크플로우가 생성합니다. 직접 수정하지 마세요."; cat "$BUNDLE_FILE"; } > "$BUNDLE_FILE.tmp"
          mv "$BUNDLE_FILE.tmp" "$BUNDLE_FILE"
          cat "$BUNDLE_FILE"

      - name: release 브랜치 커밋 및 push
        run: |
          set -euo pipefail

          branch="release/${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          mkdir -p releases
          cp "$BUNDLE_FILE" "releases/${RELEASE_VERSION}.yaml"
          git add "releases/${RELEASE_VERSION}.yaml"
          git commit -m "release: ${RELEASE_VERSION} 번들 생성 (FE ${FRONTEND_TAG}, BE ${BACKEND_TAG}, AI ${AI_TAG})"
          git push origin "$branch"

          # 실행 결과 화면에 번들 내용과 PR 생성 링크를 남긴다
          {
            echo "## Release Bundle \`${RELEASE_VERSION}\` 생성 완료"
            echo
            echo "[main 대상 PR 만들기](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)"
            echo
            echo '```yaml'
            cat "$BUNDLE_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
